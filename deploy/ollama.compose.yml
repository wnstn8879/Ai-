# Local/private inference only. The mobile app calls IMAGINE, never this port.
services:
  ollama:
    image: ollama/ollama:0.40.16
    environment:
      OLLAMA_NO_CLOUD: 'true'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
    ports:
      - '127.0.0.1:11434:11434'
    volumes:
      - imagine-models:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 5s
      timeout: 3s
      retries: 30
  model-init:
    image: ollama/ollama:0.40.16
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ['ollama', 'pull']
    command: ['${IMAGINE_MODEL:-qwen3:4b-instruct}']
    restart: 'no'
volumes:
  imagine-models:
