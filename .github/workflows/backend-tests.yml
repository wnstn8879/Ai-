name: StoryVerse checks
on:
  push:
    branches: [develop/storyverse-foundation, 'feat/**']
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: ${{ matrix.database == 'postgres' && 'postgres:17-alpine' || '' }}
        env:
          POSTGRES_USER: storyverse_ci
          POSTGRES_PASSWORD: ci-only-not-production
          POSTGRES_DB: storyverse_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U storyverse_ci -d storyverse_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://storyverse_ci:ci-only-not-production@localhost:5432/storyverse_ci' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx expo install --check
      - run: npm test
      - run: npm run check
